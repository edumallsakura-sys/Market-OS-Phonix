name: Build ALPHAFLOW OS v1.1.7 APK - STANDALONE BUNDLE HOTFIX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      # Do not enable npm cache here. The dependency files may still be inside
      # one or two ZIP layers at this stage.

      - name: Verify preinstalled Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          node --version
          npm --version
          test -d "$ANDROID_HOME" || { echo "ERROR: ANDROID_HOME missing: $ANDROID_HOME"; exit 1; }
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || {
            echo "ERROR: Android platform 36 is not preinstalled."
            ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/36.0.0" || {
            echo "ERROR: Android Build Tools 36.0.0 are not preinstalled."
            ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true
            exit 1
          }
          echo "Android SDK OK. No sdkmanager call is required."

      - name: Diagnose repository upload
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Repository files (depth <= 5) ---'
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
            -not -path '*/.git/*' | sed "s#^$GITHUB_WORKSPACE/##" | sort | head -500

      - name: Locate Expo source through direct files or nested ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          import sys
          import zipfile
          from collections import deque
          from pathlib import Path

          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          runner_temp = Path(os.environ['RUNNER_TEMP']).resolve()
          work = runner_temp / 'alphaflow_discovery'
          result_file = runner_temp / 'alphaflow_project_dir.txt'

          if work.exists():
              shutil.rmtree(work)
          work.mkdir(parents=True, exist_ok=True)

          MAX_DEPTH = 4
          MAX_ARCHIVES = 24
          MAX_FILES_PER_ARCHIVE = 8000
          MAX_UNCOMPRESSED_BYTES = 700 * 1024 * 1024

          def project_score(directory: Path):
              pkg_file = directory / 'package.json'
              app_file = directory / 'app.json'
              if not pkg_file.is_file() or not app_file.is_file():
                  return None
              try:
                  pkg = json.loads(pkg_file.read_text(encoding='utf-8'))
                  app = json.loads(app_file.read_text(encoding='utf-8'))
              except Exception:
                  return None
              expo = app.get('expo', {}) if isinstance(app, dict) else {}
              score = 0
              if pkg.get('name') == 'alphaflow-os':
                  score += 10
              if expo.get('slug') == 'alphaflow-os':
                  score += 10
              if expo.get('android', {}).get('package') == 'com.alphaflow.os':
                  score += 5
              return score if score > 0 else None

          def find_project(root: Path):
              candidates = []
              direct_score = project_score(root)
              if direct_score is not None:
                  candidates.append((direct_score + 100, root))
              for pkg in root.rglob('package.json'):
                  if 'node_modules' in pkg.parts or '.git' in pkg.parts:
                      continue
                  directory = pkg.parent
                  score = project_score(directory)
                  if score is not None:
                      depth = len(directory.relative_to(root).parts)
                      candidates.append((score - depth, directory))
              if not candidates:
                  return None
              candidates.sort(key=lambda item: (-item[0], str(item[1])))
              return candidates[0][1].resolve()

          def safe_extract(archive: Path, destination: Path):
              with zipfile.ZipFile(archive) as zf:
                  infos = zf.infolist()
                  if len(infos) > MAX_FILES_PER_ARCHIVE:
                      raise RuntimeError(f'too many files ({len(infos)})')
                  total = sum(max(0, i.file_size) for i in infos)
                  if total > MAX_UNCOMPRESSED_BYTES:
                      raise RuntimeError(f'uncompressed size too large ({total} bytes)')
                  destination.mkdir(parents=True, exist_ok=True)
                  dest_resolved = destination.resolve()
                  for info in infos:
                      target = (destination / info.filename).resolve()
                      if target != dest_resolved and dest_resolved not in target.parents:
                          raise RuntimeError(f'unsafe ZIP path: {info.filename}')
                  zf.extractall(destination)

          # Mode A: project is already unpacked in repository.
          project = find_project(workspace)
          if project is not None:
              print(f'Using unpacked ALPHAFLOW project: {project}')
              result_file.write_text(str(project), encoding='utf-8')
              sys.exit(0)

          # Modes B/C/D: inner SOURCE ZIP, versioned SOURCE ZIP, or outer ONECLICK ZIP.
          archives = []
          preferred = workspace / 'projects' / 'ALPHAFLOW_OS_SOURCE.zip'
          if preferred.is_file():
              archives.append(preferred)

          for path in workspace.rglob('*.zip'):
              if '.git' in path.parts:
                  continue
              resolved = path.resolve()
              if resolved not in [p.resolve() for p in archives]:
                  archives.append(resolved)

          # Prefer explicit SOURCE archives. If the repository contains several old
          # versioned ALPHAFLOW packages, prefer the highest semantic version instead
          # of accidentally rebuilding an older ZIP that sorts first alphabetically.
          import re

          def version_tuple(name: str):
              upper = name.upper()
              match = re.search(r'V(\d+)[._-](\d+)(?:[._-](\d+))?', upper)
              if not match:
                  return (0, 0, 0)
              return tuple(int(x or 0) for x in match.groups())

          def priority(path: Path):
              name = path.name.upper()
              version = version_tuple(name)
              newest_first = tuple(-x for x in version)
              if name == 'ALPHAFLOW_OS_SOURCE.ZIP':
                  return (0, newest_first, name)
              if 'ALPHAFLOW' in name and 'SOURCE' in name:
                  return (1, newest_first, name)
              if 'ALPHAFLOW' in name and 'ONECLICK' in name:
                  return (2, newest_first, name)
              return (3, newest_first, name)

          archives.sort(key=priority)
          queue = deque((p, 0) for p in archives)
          seen = set()
          count = 0

          while queue and count < MAX_ARCHIVES:
              archive, depth = queue.popleft()
              if depth > MAX_DEPTH:
                  continue
              try:
                  key = (str(archive.resolve()), archive.stat().st_size)
              except OSError:
                  continue
              if key in seen:
                  continue
              seen.add(key)
              count += 1
              destination = work / f'archive_{count:02d}_depth_{depth}'
              print(f'Extracting depth={depth}: {archive}')
              try:
                  safe_extract(archive, destination)
              except Exception as exc:
                  print(f'WARN: could not extract {archive}: {exc}')
                  continue

              project = find_project(destination)
              if project is not None:
                  print(f'ALPHAFLOW Expo project found: {project}')
                  result_file.write_text(str(project), encoding='utf-8')
                  sys.exit(0)

              if depth < MAX_DEPTH:
                  nested = [p.resolve() for p in destination.rglob('*.zip')]
                  nested.sort(key=priority)
                  for path in nested:
                      queue.append((path, depth + 1))

          print('ERROR: No valid ALPHAFLOW Expo project was found.')
          print('Accepted upload forms:')
          print('  1) unpacked Expo project at repo root')
          print('  2) projects/ALPHAFLOW_OS_SOURCE.zip')
          print('  3) ALPHAFLOW *_SOURCE*.zip anywhere in repo')
          print('  4) ALPHAFLOW *_GITHUB_ONECLICK.zip uploaded AS-IS')
          print('ZIP files currently visible in repository:')
          for path in sorted(workspace.rglob('*.zip')):
              if '.git' not in path.parts:
                  print(' -', path.relative_to(workspace))
          sys.exit(1)
          PY

          test -f "$RUNNER_TEMP/alphaflow_project_dir.txt" || {
            echo 'ERROR: discovery script did not produce a project path.'
            exit 1
          }
          PROJECT_DIR="$(cat "$RUNNER_TEMP/alphaflow_project_dir.txt")"
          test -f "$PROJECT_DIR/package.json" || { echo "ERROR: package.json missing at $PROJECT_DIR"; exit 1; }
          test -f "$PROJECT_DIR/app.json" || { echo "ERROR: app.json missing at $PROJECT_DIR"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Expo project found at: $PROJECT_DIR"
          node -p "require('$PROJECT_DIR/package.json').version"

      - name: Static preflight before npm
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 static_audit.py
          python3 -m json.tool package.json >/dev/null
          python3 -m json.tool app.json >/dev/null
          test -f App.tsx
          test -f index.js
          test -f assets/icon.png
          grep -q '"compileSdkVersion": 36' app.json
          grep -q '"targetSdkVersion": 36' app.json
          grep -q '"minSdkVersion": 26' app.json

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: TypeScript strict check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm run typecheck

      - name: Generate native Android project with Expo prebuild
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npx expo prebuild --platform android --clean --no-install
          test -d android || { echo 'ERROR: Expo prebuild did not create android/'; exit 1; }
          test -f android/settings.gradle -o -f android/settings.gradle.kts || {
            echo 'ERROR: settings.gradle missing AFTER Expo prebuild'
            find android -maxdepth 3 -type f | sort | head -200
            exit 1
          }
          test -f android/gradlew || { echo 'ERROR: Gradle wrapper missing after Expo prebuild'; exit 1; }

      - name: Verify standalone bundle configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -q 'debuggableVariants = \[\]' android/app/build.gradle || {
            echo 'ERROR: standalone Debug bundle safety patch was not generated.'
            sed -n '/react {/,/}/p' android/app/build.gradle | head -120 || true
            exit 1
          }
          echo 'Standalone bundle configuration is present.'

      - name: Build standalone APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          chmod +x gradlew

          echo '=== Attempting normal Release APK (bundled JS) ==='
          set +e
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          RELEASE_STATUS=$?
          set -e

          APK_PATH=''
          APK_KIND=''
          if [ "$RELEASE_STATUS" -eq 0 ]; then
            APK_PATH="$(find "$PROJECT_DIR/android/app/build/outputs/apk/release" -type f -name '*.apk' | head -1 || true)"
            if [ -n "$APK_PATH" ]; then
              APK_KIND='release'
            fi
          fi

          if [ -z "$APK_PATH" ]; then
            echo 'Release APK unavailable. Falling back to standalone bundled Debug APK.'
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
            APK_PATH="$(find "$PROJECT_DIR/android/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1 || true)"
            APK_KIND='bundled-debug'
          fi

          test -n "$APK_PATH" || {
            echo 'ERROR: Gradle finished without producing an APK.'
            find "$PROJECT_DIR/android/app/build/outputs" -maxdepth 7 -type f 2>/dev/null | sort || true
            exit 1
          }

          echo "$APK_PATH" > "$RUNNER_TEMP/alphaflow_apk_path.txt"
          echo "$APK_KIND" > "$RUNNER_TEMP/alphaflow_apk_kind.txt"
          ls -lh "$APK_PATH"

      - name: Validate APK contains offline JavaScript bundle
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(cat "$RUNNER_TEMP/alphaflow_apk_path.txt")"
          python3 - "$APK_PATH" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as zf:
              names=set(zf.namelist())
              required='assets/index.android.bundle'
              if required not in names:
                  print('ERROR: APK has no', required)
                  print('Assets found:')
                  for name in sorted(n for n in names if n.startswith('assets/'))[:200]:
                      print(' -', name)
                  raise SystemExit(1)
              info=zf.getinfo(required)
              if info.file_size < 1000:
                  print('ERROR: JavaScript bundle exists but is implausibly small:', info.file_size)
                  raise SystemExit(1)
              print('Standalone JS bundle OK:', required, info.file_size, 'bytes')
          PY

      - name: Stage standalone APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="$(cat "$RUNNER_TEMP/alphaflow_apk_path.txt")"
          APK_KIND="$(cat "$RUNNER_TEMP/alphaflow_apk_kind.txt")"
          FINAL_APK="$RUNNER_TEMP/ALPHAFLOW-OS-v1.1.7-standalone.apk"
          cp "$SOURCE_APK" "$FINAL_APK"
          echo "APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"
          echo "APK_KIND=$APK_KIND" >> "$GITHUB_ENV"
          echo "Standalone APK kind: $APK_KIND"
          ls -lh "$FINAL_APK"

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALPHAFLOW-OS-v1.1.7-STANDALONE-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
