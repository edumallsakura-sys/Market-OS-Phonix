name: Build ALPHAFLOW OS v1.1.4 APK - NODE CACHE HOTFIX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      # IMPORTANT: Do not enable setup-node npm cache here.
      # The actual package.json/package-lock.json lives inside the source ZIP
      # and does not exist in the checkout until a later extraction step.

      - name: Verify preinstalled Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          node --version
          npm --version
          test -d "$ANDROID_HOME" || { echo "ERROR: ANDROID_HOME missing: $ANDROID_HOME"; exit 1; }
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || {
            echo "ERROR: Android platform 36 is not preinstalled."
            ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/36.0.0" || {
            echo "ERROR: Android Build Tools 36.0.0 are not preinstalled."
            ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true
            exit 1
          }
          echo "Android SDK OK. No sdkmanager call is required."

      - name: Diagnose repository upload
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Repository files (depth <= 4) ---'
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
            -not -path '*/.git/*' | sed "s#^$GITHUB_WORKSPACE/##" | sort | head -400

      - name: Locate or extract Expo source automatically
        shell: bash
        run: |
          set -euo pipefail

          # Mode A: user uploaded an unpacked Expo project directly to repository root.
          if [[ -f "$GITHUB_WORKSPACE/package.json" && -f "$GITHUB_WORKSPACE/app.json" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Using unpacked Expo project at repository root."
          else
            # Mode B: preferred stable path used by ALPHAFLOW releases from v1.1.3 onward.
            SOURCE_ZIP="$GITHUB_WORKSPACE/projects/ALPHAFLOW_OS_SOURCE.zip"

            # Mode C: compatibility fallback for older versioned source ZIP names.
            if [[ ! -f "$SOURCE_ZIP" ]]; then
              SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" -type f \( \
                -iname 'ALPHAFLOW*SOURCE*.zip' -o \
                -iname '*ALPHAFLOW*SOURCE*.zip' \
              \) -not -path '*/.git/*' | sort | head -1 || true)"
            fi

            if [[ -z "${SOURCE_ZIP:-}" || ! -f "$SOURCE_ZIP" ]]; then
              echo 'ERROR: No ALPHAFLOW Expo source was found.'
              echo 'Expected preferred file: projects/ALPHAFLOW_OS_SOURCE.zip'
              echo 'Upload ALL contents extracted from the ONECLICK package, not only build-apk.yml.'
              echo 'ZIP files currently in repository:'
              find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print || true
              exit 1
            fi

            echo "Source ZIP selected: ${SOURCE_ZIP#$GITHUB_WORKSPACE/}"
            rm -rf "$RUNNER_TEMP/alphaflow_source"
            mkdir -p "$RUNNER_TEMP/alphaflow_source"
            unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/alphaflow_source"

            PROJECT_DIR="$(find "$RUNNER_TEMP/alphaflow_source" -type f -name package.json \
              -not -path '*/node_modules/*' -printf '%h\n' | head -1 || true)"
          fi

          test -n "${PROJECT_DIR:-}" || {
            echo 'ERROR: package.json not found in ALPHAFLOW source.'
            exit 1
          }
          test -f "$PROJECT_DIR/app.json" || {
            echo "ERROR: app.json not found beside $PROJECT_DIR/package.json"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Expo project found at: $PROJECT_DIR"
          echo '--- package version ---'
          node -p "require('$PROJECT_DIR/package.json').version"

      - name: Static preflight before npm
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 static_audit.py
          python3 -m json.tool package.json >/dev/null
          python3 -m json.tool app.json >/dev/null
          test -f App.tsx
          test -f index.js
          test -f assets/icon.png
          grep -q '"compileSdkVersion": 36' app.json
          grep -q '"targetSdkVersion": 36' app.json
          grep -q '"minSdkVersion": 26' app.json

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: TypeScript strict check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm run typecheck

      - name: Generate native Android project with Expo prebuild
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npx expo prebuild --platform android --clean --no-install
          test -d android || { echo 'ERROR: Expo prebuild did not create android/'; exit 1; }
          test -f android/settings.gradle -o -f android/settings.gradle.kts || {
            echo 'ERROR: settings.gradle missing AFTER Expo prebuild'
            find android -maxdepth 3 -type f | sort | head -200
            exit 1
          }
          test -f android/gradlew || { echo 'ERROR: Gradle wrapper missing after Expo prebuild'; exit 1; }

      - name: Build debug APK with generated Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find "$PROJECT_DIR/android/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1 || true)"
          test -n "$APK_PATH" || {
            echo 'ERROR: Gradle finished but APK was not found.'
            find "$PROJECT_DIR/android/app/build/outputs" -maxdepth 6 -type f 2>/dev/null | sort || true
            exit 1
          }
          FINAL_APK="$RUNNER_TEMP/ALPHAFLOW-OS-v1.1.4-debug.apk"
          cp "$APK_PATH" "$FINAL_APK"
          echo "APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$FINAL_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALPHAFLOW-OS-v1.1.4-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
