
name: Build ALPHAFLOW OS v1.1.1 APK - EXPO PREBUILD HOTFIX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'projects/ALPHAFLOW_OS_V1_1_1_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_ZIP: projects/ALPHAFLOW_OS_V1_1_1_SOURCE.zip
      CI: '1'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

      - name: Extract Expo source and locate package.json
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || { echo "ERROR: Missing $SOURCE_ZIP"; exit 1; }
          rm -rf "$RUNNER_TEMP/alphaflow_source"
          mkdir -p "$RUNNER_TEMP/alphaflow_source"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/alphaflow_source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/alphaflow_source" -type f -name package.json -printf '%h\n' | head -1 || true)"
          test -n "$PROJECT_DIR" || { echo 'ERROR: package.json not found after extracting Expo source'; find "$RUNNER_TEMP/alphaflow_source" -maxdepth 4 -type f | sort; exit 1; }
          test -f "$PROJECT_DIR/app.json" || { echo 'ERROR: app.json not found beside package.json'; exit 1; }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Expo project found at: $PROJECT_DIR"
          echo "IMPORTANT: settings.gradle is NOT expected yet. Expo prebuild creates it later."

      - name: Static preflight before npm
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 static_audit.py
          python3 -m json.tool package.json >/dev/null
          python3 -m json.tool app.json >/dev/null
          test -f App.tsx
          test -f index.js
          test -f assets/icon.png

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: TypeScript strict check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm run typecheck

      - name: Generate native Android project with Expo prebuild
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npx expo prebuild --platform android --clean --no-install

          test -d android || { echo 'ERROR: Expo prebuild did not create android/'; exit 1; }
          test -f android/settings.gradle -o -f android/settings.gradle.kts || {
            echo 'ERROR: settings.gradle still missing AFTER Expo prebuild'
            find android -maxdepth 3 -type f | sort | head -200
            exit 1
          }
          test -f android/gradlew || { echo 'ERROR: Gradle wrapper missing after Expo prebuild'; exit 1; }
          echo 'Android project generated successfully.'

      - name: Build debug APK with generated Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find "$PROJECT_DIR/android/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1 || true)"
          test -n "$APK_PATH" || {
            echo 'ERROR: Gradle finished but APK was not found.'
            find "$PROJECT_DIR/android/app/build/outputs" -maxdepth 6 -type f 2>/dev/null | sort || true
            exit 1
          }
          FINAL_APK="$RUNNER_TEMP/ALPHAFLOW-OS-v1.1.1-debug.apk"
          cp "$APK_PATH" "$FINAL_APK"
          echo "APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$FINAL_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALPHAFLOW-OS-v1.1.1-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
