name: Build MarketOS Phoenix v2.5 APK - SDK HOTFIX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'projects/MarketOS_Phoenix_v2_5_POLICY_DESK_ANDROID_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    # Pin the runner image so the preinstalled Android toolchain is predictable.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PHOENIX_SOURCE_ZIP: projects/MarketOS_Phoenix_v2_5_POLICY_DESK_ANDROID_SOURCE.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # IMPORTANT: do NOT call android-actions/setup-android or sdkmanager here.
      # GitHub's ubuntu-24.04 image already contains Android platform 35 and
      # build-tools 35.x. This avoids the cmdline-tools/sdkmanager failure.
      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0" || test -d "$ANDROID_HOME/build-tools/35.0.1"
          echo "Android SDK 35 is already available; no sdkmanager call is needed."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Phoenix Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PHOENIX_SOURCE_ZIP" || {
            echo "ERROR: expected Phoenix source ZIP not found: $PHOENIX_SOURCE_ZIP" >&2
            echo "Do not leave an old MarketOS V35 ZIP/workflow in place and rely on auto-detection." >&2
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          }

          rm -rf "$RUNNER_TEMP/phoenix_source"
          mkdir -p "$RUNNER_TEMP/phoenix_source"
          unzip -q "$PHOENIX_SOURCE_ZIP" -d "$RUNNER_TEMP/phoenix_source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/phoenix_source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -1 || true)"
          test -n "$PROJECT_DIR" || { echo 'ERROR: Phoenix Android settings.gradle not found.' >&2; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Phoenix project: $PROJECT_DIR"

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/java/com/marketos/phoenix/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/marketos/phoenix/PdfViewerActivity.java"
          grep -q 'MarketOSPhoenix' "$PROJECT_DIR/settings.gradle"
          grep -q "compileSdk 35" "$PROJECT_DIR/app/build.gradle"
          if [ -f "$PROJECT_DIR/static_audit.py" ]; then
            python3 "$PROJECT_DIR/static_audit.py"
          fi
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" <<'PYJS'
          import re,sys,pathlib
          h=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',h,re.S)
          if not m: raise SystemExit('No script block found')
          pathlib.Path('/tmp/marketos-phoenix.js').write_text(m.group(1),encoding='utf-8')
          PYJS
          node --check /tmp/marketos-phoenix.js

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1 || true)"
          test -n "$APK_PATH" || { echo 'ERROR: APK not produced.' >&2; exit 1; }
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK found: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketOS-Phoenix-v2.5-POLICY-DESK-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files
          -found: error
