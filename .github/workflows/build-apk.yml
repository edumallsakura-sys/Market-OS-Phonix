name: Build MarketOS Phoenix v2.5 APK - SDK HOTFIX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'projects/MarketOS_Phoenix_v2_5_POLICY_DESK_ANDROID_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PHOENIX_SOURCE_ZIP: projects/MarketOS_Phoenix_v2_5_POLICY_DESK_ANDROID_SOURCE.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || {
            echo "ERROR: Android platform 35 not found at $ANDROID_HOME/platforms/android-35" >&2
            ls "$ANDROID_HOME/platforms" || true
            exit 1
          }
          if ! compgen -G "$ANDROID_HOME/build-tools/35.*" > /dev/null; then
            echo "ERROR: build-tools 35.x not found at $ANDROID_HOME/build-tools" >&2
            ls "$ANDROID_HOME/build-tools" || true
            exit 1
          fi
          echo "Android SDK 35 is available."

      - name: Set up Gradle 8.9 (fallback if no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Phoenix Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PHOENIX_SOURCE_ZIP" || {
            echo "ERROR: expected Phoenix source ZIP not found: $PHOENIX_SOURCE_ZIP" >&2
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          }

          rm -rf "$RUNNER_TEMP/phoenix_source"
          mkdir -p "$RUNNER_TEMP/phoenix_source"
          unzip -q "$PHOENIX_SOURCE_ZIP" -d "$RUNNER_TEMP/phoenix_source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/phoenix_source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1 || true)"
          test -n "$SETTINGS_FILE" || { echo 'ERROR: Phoenix Android settings.gradle(.kts) not found.' >&2; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SETTINGS_FILE=$SETTINGS_FILE" >> "$GITHUB_ENV"
          echo "Phoenix project: $PROJECT_DIR"

          # Ensure Gradle can find the SDK without relying on environment inheritance.
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          # Mark wrapper executable if present.
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/java/com/marketos/phoenix/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/marketos/phoenix/PdfViewerActivity.java"

          grep -q 'MarketOSPhoenix' "$SETTINGS_FILE"

          APP_BUILD_FILE=""
          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            APP_BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            APP_BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          else
            echo "ERROR: app/build.gradle(.kts) not found." >&2
            exit 1
          fi
          grep -Eq 'compileSdk(Version)?[[:space:]]*(=)?[[:space:]]*35' "$APP_BUILD_FILE" || {
            echo "ERROR: compileSdk 35 not found in $APP_BUILD_FILE" >&2
            grep -n 'compileSdk' "$APP_BUILD_FILE" || true
            exit 1
          }

          if [ -f "$PROJECT_DIR/static_audit.py" ]; then
            python3 "$PROJECT_DIR/static_audit.py"
          fi

          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" <<'PYJS'
          import re,sys,pathlib
          h=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',h,re.S)
          if not m: raise SystemExit('No script block found')
          pathlib.Path('/tmp/marketos-phoenix.js').write_text(m.group(1),encoding='utf-8')
          PYJS
          node --check /tmp/marketos-phoenix.js

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1 || true)"
          test -n "$APK_PATH" || { echo 'ERROR: APK not produced.' >&2; exit 1; }
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK found: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketOS-Phoenix-v2.5-POLICY-DESK-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
