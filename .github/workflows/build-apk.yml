name: Build Android APK (Auto-detect any ZIP)

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Đường dẫn file ZIP (để trống = tự tìm tất cả ZIP trong repo)'
        required: false
        default: ''
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP files
        id: find
        shell: bash
        run: |
          set -euo pipefail
          INPUT_ZIP="${{ inputs.zip_path || '' }}"

          if [ -n "$INPUT_ZIP" ]; then
            if [ ! -f "$INPUT_ZIP" ]; then
              echo "ERROR: input zip not found: $INPUT_ZIP" >&2
              exit 1
            fi
            ZIPS="$INPUT_ZIP"
          else
            mapfile -t ZIP_LIST < <(find . -type f -iname '*.zip' -not -path './.git/*' | sed 's|^\./||' | sort)
            if [ ${#ZIP_LIST[@]} -eq 0 ]; then
              echo "ERROR: không tìm thấy file .zip nào trong repo." >&2
              exit 1
            fi
            ZIPS=$(printf '%s\n' "${ZIP_LIST[@]}")
          fi

          echo "ZIP files được chọn:"
          echo "$ZIPS"

          JSON=$(printf '%s\n' "$ZIPS" | python3 -c '
          import sys, json
          lines = [l.strip() for l in sys.stdin if l.strip()]
          items = [{"zip": l, "name": l.replace("/", "_").replace(".zip","")} for l in lines]
          print(json.dumps(items))
          ')
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$JSON" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Sẽ build $COUNT file ZIP."

  build:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ZIP_FILE: ${{ matrix.zip }}
      BUILD_NAME: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || {
            echo "ERROR: Android platform 35 missing" >&2
            ls "$ANDROID_HOME/platforms" || true
            exit 1
          }
          if ! compgen -G "$ANDROID_HOME/build-tools/35.*" > /dev/null; then
            echo "ERROR: build-tools 35.x missing" >&2
            exit 1
          fi
          echo "Android SDK 35 OK."

      - name: Set up Gradle (fallback nếu không có wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP và tìm project Android (đệ quy)
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ZIP_FILE" || { echo "ERROR: không thấy $ZIP_FILE" >&2; exit 1; }

          WORK="$RUNNER_TEMP/build_${BUILD_NAME}"
          rm -rf "$WORK"
          mkdir -p "$WORK/extracted"
          unzip -q "$ZIP_FILE" -d "$WORK/extracted"

          python3 - "$WORK/extracted" "$WORK/nested" <<'PYEOF'
          import os, zipfile, sys

          outer_dir = sys.argv[1]
          work_dir = sys.argv[2]

          def find_settings(root):
              for dirpath, _, filenames in os.walk(root):
                  for f in filenames:
                      if f in ('settings.gradle', 'settings.gradle.kts'):
                          return os.path.join(dirpath, f)
              return None

          def extract_nested(root, out_root, level=1):
              zips = []
              for dirpath, _, filenames in os.walk(root):
                  for f in filenames:
                      if f.lower().endswith('.zip'):
                          zips.append(os.path.join(dirpath, f))
              
              if not zips:
                  return None
              
              print(f"--- Level {level}: found {len(zips)} nested zip(s)")
              extracted_paths = []
              for i, z in enumerate(zips):
                  out_dir = os.path.join(out_root, f"lvl{level}_{i}")
                  os.makedirs(out_dir, exist_ok=True)
                  try:
                      with zipfile.ZipFile(z, 'r') as zip_ref:
                          zip_ref.extractall(out_dir)
                      extracted_paths.append(out_dir)
                      print(f"  Extracted: {z} -> {out_dir}")
                  except Exception as e:
                      print(f"  FAILED to extract {z}: {e}", file=sys.stderr)
              
              for p in extracted_paths:
                  s = find_settings(p)
                  if s:
                      return s
              
              for p in extracted_paths:
                  s = extract_nested(p, out_root, level+1)
                  if s:
                      return s
              
              return None

          settings_file = find_settings(outer_dir)
          if settings_file:
              print(f"Found settings at outer level: {settings_file}")
          else:
              print("Not found at outer level. Starting nested extraction...")
              settings_file = extract_nested(outer_dir, work_dir)

          if settings_file:
              project_dir = os.path.dirname(settings_file)
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"PROJECT_DIR={project_dir}\n")
                  f.write(f"SETTINGS_FILE={settings_file}\n")
              print(f"SUCCESS: Found project dir: {project_dir}")
          else:
              print("ERROR: Could not find settings.gradle in any extracted content", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "app/src/main/assets/index.html" ]; then
            echo "index.html OK"
          else
            echo "Cảnh báo: không có app/src/main/assets/index.html (bỏ qua)."
          fi

          if [ -f "static_audit.py" ]; then
            python3 static_audit.py || echo "static_audit.py báo lỗi (đã ghi nhận, tiếp tục)."
          fi

          if [ -f "app/src/main/assets/index.html" ]; then
            python3 - "app/src/main/assets/index.html" <<'PYJS'
          import re,sys,pathlib
          h=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',h,re.S)
          if m:
              pathlib.Path('/tmp/check.js').write_text(m.group(1),encoding='utf-8')
              print("JS extracted")
          PYJS
            if [ -f /tmp/check.js ]; then
              node --check /tmp/check.js || echo "node --check báo lỗi (đã ghi nhận, tiếp tục)."
            fi
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1 || true)"
          test -n "$APK_PATH" || { echo 'ERROR: không có APK nào được tạo.' >&2; exit 1; }
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Tìm thấy APK: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ matrix.name }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
